# ============================================
# BaleTani - Docker Compose Configuration
# Full Stack: MySQL, Backend, Frontend, ML Service
# ============================================

services:
  # ============================================
  # DATABASE SERVICE - MySQL
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: baletani-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-baletani}
      MYSQL_USER: ${DB_USER:-baletani_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-baletani_password}
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - baletani-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ============================================
  # REDIS SERVICE - Caching (Optional)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: baletani-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - baletani-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: redis-server --appendonly yes

  # ============================================
  # BACKEND SERVICE - Node.js API
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baletani-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-baletani}
      DB_USER: ${DB_USER:-baletani_user}
      DB_PASSWORD: ${DB_PASSWORD:-baletani_password}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # ML Service
      ML_SERVICE_URL: http://ml-service:8000
      # WhatsApp
      WHATSAPP_ADMIN_PHONE: ${WHATSAPP_ADMIN_PHONE:-6287735517999}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_uploads:/app/public/uploads
    networks:
      - baletani-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # ML RECOMMENDATION SERVICE - Python/FastAPI
  # ============================================
  ml-service:
    build:
      context: ./ml-recommendation-service
      dockerfile: Dockerfile
    container_name: baletani-ml-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      PORT: 8000
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Database (jika diperlukan)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-baletani}
      DB_USER: ${DB_USER:-baletani_user}
      DB_PASSWORD: ${DB_PASSWORD:-baletani_password}
    ports:
      - "${ML_PORT:-8000}:8000"
    volumes:
      - ml_models:/app/models_artifacts
      - ml_data:/app/data
    networks:
      - baletani-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # FRONTEND SERVICE - React/Vite + Nginx
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_ML_API_URL: ${VITE_ML_API_URL:-/ml-api}
    container_name: baletani-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - baletani-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ============================================
# NETWORKS
# ============================================
networks:
  baletani-network:
    driver: bridge
    name: baletani-network

# ============================================
# VOLUMES
# ============================================
volumes:
  mysql_data:
    name: baletani-mysql-data
  redis_data:
    name: baletani-redis-data
  backend_uploads:
    name: baletani-backend-uploads
  ml_models:
    name: baletani-ml-models
  ml_data:
    name: baletani-ml-data
